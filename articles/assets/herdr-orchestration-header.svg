<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <rect y="0" width="4" height="1" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <filter id="glowG" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowA" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="#0a0e0a"/>
  <radialGradient id="vig" cx="50%" cy="45%" r="75%">
    <stop offset="0%" stop-color="#101710"/>
    <stop offset="100%" stop-color="#0a0e0a"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vig)"/>

  <!-- hierarchy lines: MAIN -> ADMIN -> workers, ADMIN -> CHECKER -->
  <g stroke="#1d4a2a" stroke-width="2" fill="none">
    <path d="M800 210 V262"/>
    <path d="M760 484 V520 H190 V556"/>
    <path d="M780 484 V520 H590 V556"/>
    <path d="M820 484 V520 H990 V556"/>
    <path d="M840 484 V520 H1390 V556"/>
  </g>
  <g stroke="#4a3a10" stroke-width="2" fill="none" stroke-dasharray="6 6">
    <path d="M1060 380 H1130"/>
  </g>

  <!-- MAIN pane -->
  <g>
    <rect x="480" y="60" width="640" height="150" rx="6" fill="#0c120c" stroke="#33ff66" stroke-width="1.5" filter="url(#glowG)"/>
    <rect x="480" y="60" width="640" height="30" rx="6" fill="#122012"/>
    <text x="500" y="81" font-size="17" fill="#33ff66" letter-spacing="2">MAIN</text>
    <text x="1096" y="81" font-size="14" fill="#1f8f44" text-anchor="end">p1</text>
    <g fill="#1f8f44">
      <rect x="500" y="108" width="360" height="8" rx="2"/>
      <rect x="500" y="128" width="480" height="8" rx="2" opacity="0.7"/>
      <rect x="500" y="148" width="280" height="8" rx="2" opacity="0.5"/>
    </g>
    <rect x="500" y="170" width="12" height="18" fill="#33ff66">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ADMIN pane (amber) -->
  <g>
    <rect x="540" y="262" width="520" height="222" rx="6" fill="#141006" stroke="#ffb000" stroke-width="2" filter="url(#glowA)"/>
    <rect x="540" y="262" width="520" height="32" rx="6" fill="#241a08"/>
    <text x="560" y="284" font-size="18" fill="#ffb000" letter-spacing="3">ADMIN</text>
    <text x="1036" y="284" font-size="14" fill="#b07a10" text-anchor="end">p9 · main</text>
    <g fill="#b07a10">
      <rect x="560" y="312" width="300" height="8" rx="2"/>
      <rect x="560" y="332" width="420" height="8" rx="2" opacity="0.75"/>
      <rect x="560" y="352" width="240" height="8" rx="2" opacity="0.55"/>
      <rect x="560" y="372" width="380" height="8" rx="2" opacity="0.75"/>
    </g>
    <text x="560" y="416" font-size="14" fill="#ffb000" opacity="0.9">WAVE 1: dispatch W1..W4</text>
    <rect x="560" y="440" width="12" height="18" fill="#ffb000">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- CHECKER pane -->
  <g>
    <rect x="1130" y="300" width="330" height="160" rx="6" fill="#0c120c" stroke="#1f8f44" stroke-width="1.5"/>
    <rect x="1130" y="300" width="330" height="28" rx="6" fill="#122012"/>
    <text x="1148" y="320" font-size="15" fill="#33ff66" letter-spacing="2" opacity="0.85">CHECKER</text>
    <text x="1446" y="320" font-size="13" fill="#1f8f44" text-anchor="end">read-only</text>
    <g fill="#1f8f44" opacity="0.7">
      <rect x="1148" y="346" width="200" height="7" rx="2"/>
      <rect x="1148" y="364" width="260" height="7" rx="2" opacity="0.7"/>
    </g>
    <text x="1148" y="404" font-size="13" fill="#33ff66" opacity="0.8">W2: idle → report once</text>
    <rect x="1148" y="424" width="10" height="16" fill="#33ff66" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Worker panes W1..W4 -->
  <g>
    <!-- W1 -->
    <rect x="60" y="556" width="300" height="220" rx="6" fill="#0c120c" stroke="#33ff66" stroke-width="1.5" filter="url(#glowG)"/>
    <rect x="60" y="556" width="300" height="28" rx="6" fill="#122012"/>
    <text x="78" y="576" font-size="15" fill="#33ff66" letter-spacing="2">W1</text>
    <text x="346" y="576" font-size="13" fill="#1f8f44" text-anchor="end">wt/w1</text>
    <g fill="#1f8f44">
      <rect x="78" y="602" width="220" height="7" rx="2"/>
      <rect x="78" y="620" width="180" height="7" rx="2" opacity="0.7"/>
      <rect x="78" y="638" width="250" height="7" rx="2" opacity="0.5"/>
      <rect x="78" y="656" width="140" height="7" rx="2" opacity="0.7"/>
    </g>
    <text x="78" y="700" font-size="13" fill="#33ff66">WORKER W1 DONE: 3be2173</text>
    <rect x="78" y="726" width="10" height="16" fill="#33ff66">
      <animate attributeName="opacity" values="1;0;1" dur="1.3s" repeatCount="indefinite"/>
    </rect>

    <!-- W2 -->
    <rect x="460" y="556" width="300" height="220" rx="6" fill="#0c120c" stroke="#33ff66" stroke-width="1.5" filter="url(#glowG)"/>
    <rect x="460" y="556" width="300" height="28" rx="6" fill="#122012"/>
    <text x="478" y="576" font-size="15" fill="#33ff66" letter-spacing="2">W2</text>
    <text x="746" y="576" font-size="13" fill="#1f8f44" text-anchor="end">wt/w2</text>
    <g fill="#1f8f44">
      <rect x="478" y="602" width="240" height="7" rx="2"/>
      <rect x="478" y="620" width="160" height="7" rx="2" opacity="0.7"/>
      <rect x="478" y="638" width="210" height="7" rx="2" opacity="0.5"/>
      <rect x="478" y="656" width="260" height="7" rx="2" opacity="0.7"/>
      <rect x="478" y="674" width="120" height="7" rx="2" opacity="0.5"/>
    </g>
    <rect x="478" y="726" width="10" height="16" fill="#33ff66">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- W3 -->
    <rect x="860" y="556" width="300" height="220" rx="6" fill="#0c120c" stroke="#33ff66" stroke-width="1.5" filter="url(#glowG)"/>
    <rect x="860" y="556" width="300" height="28" rx="6" fill="#122012"/>
    <text x="878" y="576" font-size="15" fill="#33ff66" letter-spacing="2">W3</text>
    <text x="1146" y="576" font-size="13" fill="#1f8f44" text-anchor="end">wt/w3</text>
    <g fill="#1f8f44">
      <rect x="878" y="602" width="200" height="7" rx="2"/>
      <rect x="878" y="620" width="250" height="7" rx="2" opacity="0.7"/>
      <rect x="878" y="638" width="150" height="7" rx="2" opacity="0.5"/>
    </g>
    <text x="878" y="682" font-size="13" fill="#ffd24d">NEEDS-INPUT W3 — schema?</text>
    <rect x="878" y="726" width="10" height="16" fill="#33ff66">
      <animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite"/>
    </rect>

    <!-- W4 -->
    <rect x="1260" y="556" width="280" height="220" rx="6" fill="#0c120c" stroke="#33ff66" stroke-width="1.5" filter="url(#glowG)"/>
    <rect x="1260" y="556" width="280" height="28" rx="6" fill="#122012"/>
    <text x="1278" y="576" font-size="15" fill="#33ff66" letter-spacing="2">W4</text>
    <text x="1526" y="576" font-size="13" fill="#1f8f44" text-anchor="end">wt/w4</text>
    <g fill="#1f8f44">
      <rect x="1278" y="602" width="230" height="7" rx="2"/>
      <rect x="1278" y="620" width="170" height="7" rx="2" opacity="0.7"/>
      <rect x="1278" y="638" width="240" height="7" rx="2" opacity="0.5"/>
      <rect x="1278" y="656" width="190" height="7" rx="2" opacity="0.7"/>
    </g>
    <rect x="1278" y="726" width="10" height="16" fill="#33ff66">
      <animate attributeName="opacity" values="1;0;1" dur="0.95s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- caption -->
  <text x="800" y="850" font-size="22" fill="#33ff66" text-anchor="middle" letter-spacing="6" opacity="0.9">ONE TERMINAL · TEN AGENTS · HERDR ORCHESTRATION</text>

  <!-- CRT scanline overlay -->
  <rect width="1600" height="900" fill="url(#scan)"/>
</svg>
